name: Host Tests

on:
  push:
    paths:
      - "**.cpp"
      - "**.h"
      - "utility/**"
      - "tests/**"
      - ".github/workflows/host-tests.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - "utility/**"
      - "tests/**"
      - ".github/workflows/host-tests.yml"
  workflow_dispatch:

jobs:
  hardware-tools:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test network probe without hardware
        run: |
          python tests\hardware\MulticastMdnsTest\mdns_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests\hardware\MulticastMdnsTest -p test_mdns_probe.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse hardware PowerShell scripts without running them
        shell: pwsh
        run: |
          Get-ChildItem tests\hardware\MulticastMdnsTest -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test hardware runner with synthetic commands
        shell: pwsh
        run: .\tests\hardware\MulticastMdnsTest\Test-MdnsHardwareRunner.ps1
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify historical query baseline
        env:
          MDNS_BASELINE_ONLY: "1"
        run: bash tests/run-tests.sh
      - name: Deterministic regression and property tests
        run: bash tests/run-tests.sh
      - name: Regression and allocation tests with AVR resource limits
        env:
          MDNS_AVR_LIMITS: "1"
        run: bash tests/run-tests.sh
      - name: Seeded parser and stateful UDP fuzzing
        env:
          CXX: clang++
          MDNS_FUZZ_SECONDS: "60"
          MDNS_BUILD_DIR: ${{ runner.temp }}/mdns-fuzz
        run: bash tests/run-fuzz.sh
      - name: Preserve fuzz corpus and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mdns-fuzz
          path: ${{ runner.temp }}/mdns-fuzz
          if-no-files-found: ignore
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure host tests
        run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Debug

      - name: Build host tests
        run: cmake --build build/host --parallel

      - name: Run host tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/host --output-on-failure
